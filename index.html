<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шахтар — до наступного матчу</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap');
  @font-face { font-family: 'DIN Pro'; src: url('DINPro-Medium.ttf') format('truetype'); font-weight: 500; font-display: block; }
  html, body { margin: 0; height: 100%; background: #ff5a00; overflow: hidden; cursor: none; }
  /* Фиксированная сцена 1280x1027 масштабируется под любой экран */
  #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 1027px;
           transform-origin: 0 0; font-family: 'Oswald', 'DIN Condensed', Impact, sans-serif; text-align: center; }
  .abs { position: absolute; left: 0; width: 100%; }
  #club { top: 108px; height: 266px; }
  #title { top: 398px; font-size: 46px; font-weight: 700; color: #111; letter-spacing: 1px; line-height: 60px; }
  #timer { top: 455px; height: 150px; display: flex; justify-content: center; align-items: flex-start; }
  .cell { position: relative; width: 188px; }
  .num { font-size: 108px; line-height: 120px; font-weight: 700; color: #fff; }
  .lbl { position: absolute; left: 0; right: 0; top: 118px; font-size: 25px; font-weight: 500; color: #fff; text-transform: uppercase; line-height: 30px; }
  .sep { width: 0; position: relative; }
  .sep::before, .sep::after { content: ''; position: absolute; left: -7px; width: 14px; height: 14px; background: #fff; }
  .sep::before { top: 46px; }
  .sep::after { top: 86px; }
  #teams { top: 610px; height: 104px; display: flex; justify-content: center; align-items: center; }
  .badge { width: 104px; height: 104px; background: #fff; border-radius: 22px; display: flex; align-items: center; justify-content: center; }
  .badge img { max-width: 80px; max-height: 80px; }
  .team { position: relative; }
  .tname { position: absolute; left: 50%; top: 108px; transform: translateX(-50%); width: 230px; font-size: 23px; font-weight: 500; line-height: 28px; color: #fff; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info { width: 236px; color: #fff; font-size: 19px; font-weight: 500; line-height: 34px; }
  #parallel { top: 768px; height: 62px; display: flex; justify-content: center; align-items: center; gap: 30px; }
  #parallel .blocks { display: flex; }
  #parallel .blocks i { display: block; width: 60px; height: 60px; }
  #parallel .blocks i:nth-child(1) { background: #e8112d; border-radius: 12px 0 0 12px; }
  #parallel .blocks i:nth-child(2) { background: #ff6a10; }
  #parallel .blocks i:nth-child(3) { background: #ffc01a; border-radius: 0 12px 12px 0; }
  #parallel b { font-family: 'DIN Pro', sans-serif; font-weight: 500; font-size: 66px; color: #fff; line-height: 62px; }
  #partner { top: 868px; font-size: 56px; font-weight: 500; color: #fff; text-transform: uppercase; letter-spacing: 1px; line-height: 70px; }
  #err { position: fixed; right: 10px; bottom: 6px; font: 12px sans-serif; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
<div id="stage">
  <div class="abs" id="club"><img src="shakhtar.svg" alt="Шахтар" style="height:266px;width:auto"></div>
  <div class="abs" id="title">ДО НАСТУПНОГО МАТЧУ</div>
  <div class="abs" id="timer">
    <div class="cell"><div class="num" id="d">--</div><div class="lbl" id="dl">дні</div></div>
    <div class="sep"></div>
    <div class="cell"><div class="num" id="h">--</div><div class="lbl" id="hl">годин</div></div>
    <div class="sep"></div>
    <div class="cell"><div class="num" id="m">--</div><div class="lbl" id="ml">хвилин</div></div>
    <div class="sep"></div>
    <div class="cell"><div class="num" id="s">--</div><div class="lbl" id="sl">секунд</div></div>
  </div>
  <div class="abs" id="teams">
    <div class="team"><div class="badge"><img id="homeLogo" alt=""></div><div class="tname" id="homeName"></div></div>
    <div id="info"><div id="when">&nbsp;</div><div id="league">-</div></div>
    <div class="team"><div class="badge"><img id="awayLogo" alt=""></div><div class="tname" id="awayName"></div></div>
  </div>
  <div class="abs" id="parallel"><div class="blocks"><i></i><i></i><i></i></div><b>parallel.ua</b></div>
  <div class="abs" id="partner">НАДІЙНИЙ ПАЛИВНИЙ ПАРТНЕР</div>
</div>
<div id="err"></div>
<script>
(function () {
  var stage = document.getElementById('stage'), match = null;
  function fit() {
    var k = Math.min(innerWidth / 1280, innerHeight / 1027);
    stage.style.transform = 'scale(' + k + ') translate(-50%,-50%)';
  }
  addEventListener('resize', fit); fit();

  function p2(n) { return String(n).padStart(2, '0'); }
  var FORMS = { d: ['день', 'дні', 'днів'], h: ['година', 'години', 'годин'],
                m: ['хвилина', 'хвилини', 'хвилин'], s: ['секунда', 'секунди', 'секунд'] };
  function plural(n, f) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return f[0];
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return f[1];
    return f[2];
  }
  function set(k, n) {
    document.getElementById(k).textContent = p2(n);
    document.getElementById(k + 'l').textContent = plural(n, FORMS[k]);
  }
  function tick() {
    if (!match) return;
    var left = Math.max(0, Math.floor((match.timestamp - Date.now()) / 1000));
    set('d', Math.floor(left / 86400));
    set('h', Math.floor(left % 86400 / 3600));
    set('m', Math.floor(left % 3600 / 60));
    set('s', left % 60);
  }

  function logoSrc(u, v) { return /^https?:/.test(u) ? 'logo?u=' + encodeURIComponent(u) : u + '?v=' + v; }

  function render(m) {
    match = m;
    document.getElementById('homeLogo').src = logoSrc(m.home.logo, m.timestamp);
    document.getElementById('awayLogo').src = logoSrc(m.away.logo, m.timestamp);
    document.getElementById('homeName').textContent = m.home.name;
    document.getElementById('awayName').textContent = m.away.name;
    var g = {};
    new Intl.DateTimeFormat('uk-UA', { timeZone: 'Europe/Kyiv', day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
      .formatToParts(new Date(m.timestamp)).forEach(function (x) { g[x.type] = x.value; });
    document.getElementById('when').textContent = g.day + '.' + g.month + '.' + g.year + ', ' + g.hour + ':' + g.minute + ':' + g.second;
    document.getElementById('league').textContent = m.league || '-';
    tick();
  }

  function load() {
    // Локальный сервер отдаёт api/next-match, на GitHub Pages данные лежат в match.json
    fetch('api/next-match', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .catch(function () { return fetch('match.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }); })
      .then(function (m) {
      if (m.error) throw new Error(m.error);
      render(m); document.getElementById('err').textContent = '';
    }).catch(function (e) { document.getElementById('err').textContent = 'Немає даних: ' + e.message; });
  }
  load(); setInterval(load, 10 * 60 * 1000); setInterval(tick, 250);
})();
</script>
</body>
</html>
